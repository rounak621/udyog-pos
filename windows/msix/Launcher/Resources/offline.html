<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UDYOG POS</title>
<style>
  html, body { margin: 0; height: 100%; background: #1A1A1A; color: #FFFFFF; font-family: "Segoe UI", system-ui, sans-serif; }
  main { min-height: 100%; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; }
  img { width: 240px; height: auto; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  p { margin: 0; font-size: 14px; color: #BDBDBD; }
  button { background: #FF7A1A; color: #1A1A1A; border: 1px solid #FF7A1A; border-radius: 8px; padding: 10px 28px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #E8650A; border-color: #E8650A; }
</style>
</head>
<body>
<main>
  <img src="{{LOGO}}" alt="UDYOG POS">
  <h1>Cannot reach UDYOG POS. Check your internet connection.</h1>
  <button id="retry" type="button">Retry</button>
  <p id="auto">Trying again in 10 seconds.</p>
</main>
<script>
  // The shell (ShellWindow.cs) listens for "retry" only while this page is shown.
  var left = 10;
  function retry() {
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage("retry");
  }
  document.getElementById("retry").addEventListener("click", retry);
  setInterval(function () {
    left -= 1;
    if (left <= 0) { left = 10; retry(); }
    document.getElementById("auto").textContent = "Trying again in " + left + " seconds.";
  }, 1000);
</script>
</body>
</html>
