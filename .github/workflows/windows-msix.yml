name: Windows MSIX build

# Builds the UDYOG POS Windows shell (windows/msix) on a real Windows runner
# and uploads the .msix as an artifact. Manual only. Uses the fake DEV
# identity and a throwaway self-signed test cert; no real secrets, no release.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add Windows SDK tools (makeappx, signtool) to PATH
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found under Windows Kits 10" }
          $makeappx.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build + package (DEV identity, self-signed test cert)
        shell: pwsh
        working-directory: windows/msix
        run: ./build-windows-msix.ps1 -Configuration Release -SelfSignedTest

      - name: Validate package structure
        shell: pwsh
        working-directory: windows/msix
        run: ./validate-msix.ps1 -MsixPath ./out/UDYOGPOS.msix -AllowDevIdentity

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: UDYOGPOS-msix-${{ github.sha }}
          path: |
            windows/msix/out/UDYOGPOS.msix
            windows/msix/out/udyogpos-dev.cer
          if-no-files-found: error
