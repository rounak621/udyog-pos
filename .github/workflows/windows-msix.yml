name: Windows MSIX build

# Builds the UDYOG POS Windows shell (windows/msix) on a real Windows runner
# and uploads the .msix (plus its throwaway test .cer) as an artifact.
# Manual only. Signs ONLY with a throwaway self-signed test cert; no real
# secrets, no Store upload, no release. Empty inputs = fake DEV identity.

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: "MSIX Identity Name (empty = UDYOG.POS.Dev)"
        required: false
        default: ""
      publisher:
        description: "MSIX Publisher, e.g. CN=... (empty = CN=UDYOG Dev)"
        required: false
        default: ""
      publisher_display_name:
        description: "Publisher display name (empty = DEV value)"
        required: false
        default: ""
      version:
        description: "Package version Major.Minor.Build.Revision (empty = 0.1.0.0)"
        required: false
        default: ""
      default_server_url:
        description: "Optional https server address that pre-fills the first-run form"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Add Windows SDK tools (makeappx, signtool) to PATH
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found under Windows Kits 10" }
          $makeappx.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build + package (self-signed test cert)
        shell: pwsh
        working-directory: windows/msix
        # Inputs go through env vars, never pasted into the script text.
        env:
          IN_IDENTITY_NAME: ${{ inputs.identity_name }}
          IN_PUBLISHER: ${{ inputs.publisher }}
          IN_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_DEFAULT_SERVER_URL: ${{ inputs.default_server_url }}
        run: |
          $buildArgs = @{ Configuration = 'Release'; SelfSignedTest = $true }
          if ($env:IN_IDENTITY_NAME) { $buildArgs.IdentityName = $env:IN_IDENTITY_NAME }
          if ($env:IN_PUBLISHER) { $buildArgs.Publisher = $env:IN_PUBLISHER }
          if ($env:IN_PUBLISHER_DISPLAY_NAME) { $buildArgs.PublisherDisplayName = $env:IN_PUBLISHER_DISPLAY_NAME }
          if ($env:IN_VERSION) { $buildArgs.Version = $env:IN_VERSION }
          if ($env:IN_DEFAULT_SERVER_URL) { $buildArgs.DefaultServerUrl = $env:IN_DEFAULT_SERVER_URL }
          ./build-windows-msix.ps1 @buildArgs

      - name: Validate package structure
        shell: pwsh
        working-directory: windows/msix
        # The DEV identity is expected here; validate warns instead of failing.
        run: ./validate-msix.ps1 -MsixPath ./out/UDYOGPOS.msix -AllowDevIdentity

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: UDYOGPOS-msix-${{ github.sha }}
          path: |
            windows/msix/out/UDYOGPOS.msix
            windows/msix/out/udyogpos-dev.cer
          if-no-files-found: error
