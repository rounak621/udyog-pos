name: Deploy production

# MANUAL ONLY (Actions -> Deploy production -> Run workflow). A push never
# deploys production.
# Approval: in Settings -> Environments -> production, add Required
# reviewers. The deploy job below waits for that approval before it touches
# the server.
# Inputs: `ref` = a commit on main (the run fails if it is not reachable from
# main); `tag` = optional existing image tag to redeploy (rollback), which
# skips CI and the build.
# Secrets: PRODUCTION_HOST, PRODUCTION_USER, PRODUCTION_SSH_KEY,
# PRODUCTION_DEPLOY_PATH, optional PRODUCTION_SSH_KNOWN_HOSTS.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA on main to deploy (or "main" for its latest commit)
        type: string
        required: true
      tag:
        description: Existing image tag to redeploy for a rollback (leave empty to build `ref`)
        type: string
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Reminder
        run: |
          {
            echo "## Take a database snapshot/backup BEFORE approving"
            echo ""
            echo "Production deploy of \`${{ inputs.ref }}\`${{ inputs.tag != '' && format(' (redeploying image tag `{0}`)', inputs.tag) || '' }}."
            echo "Migrations run automatically when the new backend starts and are not undone by a rollback."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - id: check
        name: The commit must be on main
        env:
          REF: ${{ inputs.ref }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
            echo "::error::invalid tag '$TAG'"; exit 1
          fi
          if [ "$REF" = "main" ]; then
            target="origin/main"
          elif [[ "$REF" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            target="$REF"
          else
            echo "::error::ref must be a commit SHA on main or the word main"; exit 1
          fi
          git fetch --no-tags origin main
          sha="$(git rev-parse --verify "${target}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not reachable from main - production only deploys commits on main"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Commit $sha is on main." >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: verify
    if: inputs.tag == ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}

  build:
    needs: [verify, ci]
    if: inputs.tag == ''
    uses: ./.github/workflows/build-images.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}
      label: main

  deploy:
    needs: [verify, build]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      (needs.build.result == 'success' || (inputs.tag != '' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Copy runtime files and deploy over SSH
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER_NAME: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          TAG: ${{ inputs.tag != '' && inputs.tag || needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::PRODUCTION_SSH_KNOWN_HOSTS not set; trusting the host key seen now"
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          fi
          opts=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          target="$USER_NAME@$HOST"
          ssh "${opts[@]}" "$target" "mkdir -p '$DEPLOY_PATH/scripts'"
          scp "${opts[@]}" docker-compose.prod.yml Caddyfile "$target:$DEPLOY_PATH/"
          scp "${opts[@]}" scripts/deploy.sh scripts/rollback.sh "$target:$DEPLOY_PATH/scripts/"
          ssh "${opts[@]}" "$target" "cd '$DEPLOY_PATH' && chmod +x scripts/deploy.sh scripts/rollback.sh && ./scripts/deploy.sh '$TAG'"
          echo "Production now runs $TAG (commit ${{ needs.verify.outputs.sha }})" >> "$GITHUB_STEP_SUMMARY"
