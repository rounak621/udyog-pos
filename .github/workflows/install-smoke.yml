name: Install smoke test

# Builds the stack from this checkout with the repo's docker-compose.yml on a
# clean runner and checks the app comes up. Catches a broken Dockerfile or a
# failing migration. Manual only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Throwaway .env for this run
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
          } > .env

      - name: Build and start
        run: docker compose up -d --build

      - name: App answers on port 1995
        run: |
          node -e '
            const urls = ["http://localhost:1995/api/health", "http://localhost:1995/signup"];
            (async () => {
              for (let i = 0; i < 60; i++) {
                try {
                  const res = await Promise.all(urls.map((u) => fetch(u)));
                  if (res.every((r) => r.ok)) { console.log("Install OK"); return; }
                } catch {}
                await new Promise((r) => setTimeout(r, 5000));
              }
              console.error("App did not come up"); process.exit(1);
            })();
          '

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=80
